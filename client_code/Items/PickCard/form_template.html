<div class="pk-wrap">
  <article class="pk-card" anvil:name="card">
    <anvil-component type="Label" name="rank" prop:role='["pk-num"]'></anvil-component>
    <div class="pk-main" anvil:name="full">
      <a class="pk-name" anvil:name="name_link" href="#explore">
        <anvil-component type="Label" name="make" prop:role='["pk-make"]'></anvil-component>
        <anvil-component type="Label" name="model" prop:role='["pk-model"]'></anvil-component>
      </a>
      <anvil-component type="Label" name="facts" prop:role='["pk-facts"]'></anvil-component>
      <anvil-component type="Label" name="eff" prop:role='["fine-print"]'></anvil-component>
      <div class="pk-listings">
        <a anvil:name="listings_link" href="#listings"><anvil-component type="Label" name="listings_text" prop:role='["pk-ltext"]'></anvil-component></a>
        <anvil-component type="Label" name="best_badge" prop:role='["badge"]'></anvil-component>
      </div>
      <label class="ui-field pk-note"><span>Your notes</span>
        <anvil-component type="TextArea" name="note_box" prop:placeholder="Test drive booked, colour, which trim..." prop:height="64"></anvil-component>
      </label>
      <div class="pk-actions">
        <anvil-component type="Button" name="find_button" prop:text="Find for sale" prop:role='["btn", "btn-sm", "btn-primary", "ic-search"]'></anvil-component>
        <anvil-component type="Button" name="add_button" prop:text="Add a listing" prop:role='["btn", "btn-sm", "ic-link"]'></anvil-component>
        <span class="pk-spacer"></span>
        <anvil-component type="Button" name="up_button" prop:text="Move up" prop:role='["btn", "btn-icon", "btn-sm", "ic-up"]'></anvil-component>
        <anvil-component type="Button" name="down_button" prop:text="Move down" prop:role='["btn", "btn-icon", "btn-sm", "ic-down"]'></anvil-component>
        <anvil-component type="Button" name="remove_button" prop:text="Remove" prop:role='["btn", "btn-icon", "btn-sm", "ic-trash"]'></anvil-component>
      </div>
    </div>
    <div class="pk-empty" anvil:name="empty">
      <b>Empty slot</b>
      <span class="muted small">Star a car on Explore to fill it.</span>
      <a class="ui-btn sm" href="#explore">Open Explore</a>
    </div>
  </article>
</div>
