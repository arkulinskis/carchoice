<div class="ui dlg edit-market">
  <anvil-component type="Label" name="heading" prop:text="Marketplace" prop:role='["dlg-title"]'></anvil-component>
  <div class="al-grid">
    <label class="ui-field al-wide"><span>Name</span><anvil-component type="TextBox" name="name_box"></anvil-component></label>
    <label class="ui-field"><span>Region</span><anvil-component type="DropDown" name="region_dd"></anvil-component></label>
    <label class="ui-field"><span>Kind</span><anvil-component type="DropDown" name="kind_dd"></anvil-component></label>
    <label class="ui-field al-wide"><span>Website</span><anvil-component type="TextBox" name="url_box" prop:placeholder="https://..."></anvil-component></label>
    <label class="ui-field al-wide"><span>Search address <em>(optional; {q} = the search words)</em></span><anvil-component type="TextBox" name="search_box" prop:placeholder="https://example.com/search?q={q}"></anvil-component></label>
    <label class="ui-field al-wide"><span>Notes</span><anvil-component type="TextArea" name="notes_box" prop:height="60"></anvil-component></label>
    <div class="al-wide"><anvil-component type="CheckBox" name="active_box" prop:text="Show it to people" prop:checked="true"></anvil-component></div>
  </div>
  <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  <div class="ui-row end">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
  </div>
</div>
